<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://veskmrxhtqryffixzkoi.supabase.co",SUPABASE_KEY="sb_publishable_rmLcBS0XYQG8hpGNmm2a2g_gdvBIJts";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const id=new URLSearchParams(location.search).get("id");let product=null;
