function normalizeGallery(p){
  let raw=p?.image_gallery;
  if(typeof raw==="string"){try{raw=JSON.parse(raw)}catch(_e){raw=raw.split(",").map(x=>x.trim()).filter(Boolean)}}
  if(!Array.isArray(raw))raw=Array.isArray(p?.gallery)?p.gallery:Array.isArray(p?.images)?p.images:[];

}
function getProductBack(){
  const fallback="./index.html";
  let label="Back";
  let target=fallback;
  let internal=false;
  try{
    const ref=document.referrer;
    if(ref){
      const u=new URL(ref,location.href);
      if(u.origin===location.origin){
        internal=true;
        if(u.pathname.endsWith("/category.html")||u.pathname.endsWith("category.html")){
          const cat=u.searchParams.get("cat");
          label=cat?"Back to "+String(cat).replace(/%20/g," "):"Back to Category";
          target=u.href;
        }else if(u.pathname.endsWith("/search.html")||u.pathname.endsWith("search.html")){
          label="Back to Search";
          target=u.href;
        }else if(u.pathname.endsWith("/index.html")||u.pathname==="/"){
          label="Back to Home";
          target=u.href;
        }else{
          label="Back";
          target=u.href;
        }
      }
    }
  }catch(_e){}
  return {label,target,internal};
}
