<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pet World Admin</title>
<style>
body{margin:0;font-family:Arial;background:#f6f7f9;color:#171717}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}input,textarea,select{padding:11px;border:1px solid #ccc;border-radius:7px;font:inherit}.btn{border:0;border-radius:7px;padding:11px 16px;font-weight:bold;cursor:pointer;background:#ffd21c}.danger{background:#e74c3c;color:#fff}.muted{color:#666}.status{padding:10px;border-radius:8px;background:#fff5b8;margin:12px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.actions{display:flex;gap:6px;flex-wrap:wrap}.preview{max-width:220px;max-height:180px;border-radius:10px;border:1px solid #ddd;display:none;object-fit:contain;background:#fafafa}.editor{display:none;margin-top:10px;padding:12px;border:1px solid #ddd;border-radius:10px}.editor canvas{max-width:100%;height:auto;border:1px solid #ddd;background:#eee}.range{display:grid;grid-template-columns:110px 1fr 45px;gap:8px;align-items:center;margin-top:8px}.range input{padding:0}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.table{font-size:13px}.wrap{padding:14px}.table-wrap{overflow:auto}.range{grid-template-columns:90px 1fr 40px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top" id="top"></div>
<div id="login" class="card"><h2>Admin Login</h2><p class="muted">Only the Pet World admin account can change products.</p><div class="grid"><label class="field">Email<input id="email" type="email" autocomplete="username" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label></div><button class="btn" style="margin-top:12px" onclick="login()">Sign In</button></div><div id="status" class="status">Please sign in.</div><div id="app" style="display:none">
<div class="card">
<h2 id="formTitle">Add Product</h2>
<form id="productForm">
<input type="hidden" id="editId">
<div class="grid">
<label class="field">Product name *<input id="name" required></label>
<label class="field">SKU *<input id="sku" required></label>
<label class="field">Price (PKR) *<input id="price" type="number" min="0" required></label>
<label class="field">Category *<input id="category" required placeholder="Dogs, Cats, Grooming…"></label>
<label class="field">Stock<input id="stock" type="number" min="0" value="0"></label>
<div class="field"><span>Product Photo</span><input id="photoFile" type="file" accept="image/*"><img id="photoPreview" class="preview" alt="Photo preview"><div class="actions"><button class="btn" type="button" onclick="openEditor()">Edit Photo</button><button class="btn" type="button" onclick="clearPhoto()">Remove</button></div><div id="editor" class="editor"><canvas id="canvas"></canvas><div class="actions" style="margin-top:10px"><button class="btn" type="button" onclick="rotatePhoto()">Rotate</button><button class="btn" type="button" onclick="cropSquare()">Crop Square</button><button class="btn" type="button" onclick="resetPhotoEdit()">Reset</button></div><div class="range"><span>Brightness</span><input id="brightness" type="range" min="50" max="150" value="100" oninput="drawEdited()"><span id="brightnessVal">100%</span></div><div class="range"><span>Contrast</span><input id="contrast" type="range" min="50" max="150" value="100" oninput="drawEdited()"><span id="contrastVal">100%</span></div><button class="btn" type="button" style="margin-top:10px" onclick="applyPhoto()">Use Edited Photo</button></div></div>
<label class="field">Image URL<input id="image_url" placeholder="Optional URL or uploaded photo"></label>
<label class="field full">Description<textarea id="description" rows="3"></textarea></label>
<label class="field"><span>Active</span><input id="active" type="checkbox" checked style="width:20px;height:20px"></label>
</div>
<div class="actions" style="margin-top:14px"><button class="btn" type="submit">Save Product</button><button class="btn" type="button" onclick="resetForm()">Clear</button></div>
</form>
</div>
<div class="card"><h2>Products</h2><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Category</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://veskmrxhtqryffixzkoi.supabase.co";
const SUPABASE_KEY="sb_publishable_rmLcBS0XYQG8hpGNmm2a2g_gdvBIJts";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let products=[], photoBlob=null, originalImage=null, rotation=0;
const $=id=>document.getElementById(id);
function setStatus(t,ok=false){$("status").textContent=t;$("status").style.background=ok?"#dff5e3":"#fff5b8"}
function pick(p,...keys){for(const k of keys)if(p[k]!==undefined&&p[k]!==null)return p[k];return ""}
async function login(){const email=$("email").value.trim();const password=$("password").value;if(!email||!password){setStatus("Enter your email and password.");return}setStatus("Signing in…");const {error}=await sb.auth.signInWithPassword({email,password});if(error){setStatus("Login failed: "+error.message);return}showApp()}
async function logout(){await sb.auth.signOut();location.reload()}
async function showApp(){const {data:{user}}=await sb.auth.getUser();if(!user){$("login").style.display="block";$("app").style.display="none";setStatus("Please sign in.");return}$("login").style.display="none";$("app").style.display="block";$("top").innerHTML="<div><h1>Pet World Admin</h1><div class='muted'>Signed in as "+esc(user.email)+"</div></div><div class='actions'><button class='btn' onclick='logout()'>Sign Out</button><a class='btn' href='./index.html'>Open Store</a></div>";await load()}
async function load(){setStatus("Loading products…");const {data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});if(error){setStatus("Database error: "+error.message);return}products=data||[];render();setStatus("Connected to Supabase. "+products.length+" product(s).",true)}
function render(){$("rows").innerHTML=products.map((p,i)=>{const id=pick(p,"id","product_id");return "<tr><td>"+esc(pick(p,"name","product_name","title"))+"</td><td>"+esc(pick(p,"sku"))+"</td><td>PKR "+Number(pick(p,"price","sale_price")||0).toLocaleString()+"</td><td>"+esc(pick(p,"category","category_name"))+"</td><td>"+esc(pick(p,"stock","quantity","inventory")||0)+"</td><td><div class='actions'><button class='btn' onclick='editProduct("+i+")'>Edit</button><button class='btn danger' onclick='removeProduct("+JSON.stringify(id)+")'>Delete</button></div></td></tr>"}).join("")||"<tr><td colspan='6'>No products yet.</td></tr>"}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function editProduct(i){const p=products[i];$("editId").value=pick(p,"id","product_id");$("name").value=pick(p,"name","product_name","title");$("sku").value=pick(p,"sku");$("price").value=pick(p,"price","sale_price");$("category").value=pick(p,"category","category_name");$("stock").value=pick(p,"stock","quantity","inventory")||0;$("image_url").value=pick(p,"image_url","image","imageUrl");$("description").value=pick(p,"description","details");$("active").checked=pick(p,"active","is_active")!==false;$("formTitle").textContent="Edit Product";scrollTo({top:0,behavior:"smooth"})}
function resetForm(){$("productForm").reset();$("editId").value="";$("active").checked=true;clearPhoto();resetPhotoEdit();$("formTitle").textContent="Add Product"}
$("photoFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{originalImage=img;photoBlob=null;rotation=0;$("photoPreview").src=reader.result;$("photoPreview").style.display="block";openEditor()};img.src=reader.result};reader.readAsDataURL(f)});
function openEditor(){if(!originalImage){setStatus("Choose a photo first.");return}$("editor").style.display="block";drawEdited()}
function drawEdited(){if(!originalImage)return;const c=$("canvas"),ctx=c.getContext("2d");let w=originalImage.naturalWidth,h=originalImage.naturalHeight;if(rotation%180!==0)[w,h]=[h,w];c.width=w;c.height=h;ctx.save();ctx.translate(c.width/2,c.height/2);ctx.rotate(rotation*Math.PI/180);ctx.filter="brightness("+$("brightness").value+"%) contrast("+$("contrast").value+"%)";ctx.drawImage(originalImage,-originalImage.naturalWidth/2,-originalImage.naturalHeight/2);ctx.restore();$("brightnessVal").textContent=$("brightness").value+"%";$("contrastVal").textContent=$("contrast").value+"%"}
function rotatePhoto(){rotation=(rotation+90)%360;drawEdited()}
function cropSquare(){if(!originalImage)return;const c=$("canvas"),ctx=c.getContext("2d");const s=Math.min(c.width,c.height);const x=(c.width-s)/2,y=(c.height-s)/2;const data=ctx.getImageData(x,y,s,s);c.width=c.height=s;ctx.putImageData(data,0,0);photoBlob=null;setStatus("Square crop preview ready.",true)}
function resetPhotoEdit(){rotation=0;$("brightness").value=100;$("contrast").value=100;$("brightnessVal").textContent="100%";$("contrastVal").textContent="100%";if(originalImage)drawEdited()}
function applyPhoto(){const c=$("canvas");c.toBlob(blob=>{photoBlob=blob;$("photoPreview").src=URL.createObjectURL(blob);$("photoPreview").style.display="block";$("editor").style.display="none";setStatus("Edited photo ready. Save the product to keep it.",true)},"image/jpeg",0.9)}
function clearPhoto(){photoBlob=null;originalImage=null;$("photoFile").value="";$("photoPreview").style.display="none";$("photoPreview").removeAttribute("src");$("editor").style.display="none"}
async function uploadPhoto(){if(!photoBlob)return null;const fileName="product-"+Date.now()+"-"+Math.random().toString(36).slice(2)+".jpg";const path=fileName;const {error}=await sb.storage.from("product-images").upload(path,photoBlob,{contentType:"image/jpeg",upsert:false});if(error){setStatus("Photo upload failed: "+error.message);return null}const {data}=sb.storage.from("product-images").getPublicUrl(path);return data.publicUrl}
async function save(e){e.preventDefault();setStatus("Saving…");const id=$("editId").value;let imageUrl=$("image_url").value.trim()||null;if(photoBlob){imageUrl=await uploadPhoto();if(!imageUrl)return}const payload={name:$("name").value.trim(),sku:$("sku").value.trim(),price:Number($("price").value),category:$("category").value.trim(),stock:Number($("stock").value||0),image_url:imageUrl,description:$("description").value.trim()||null,active:$("active").checked};let q=id?sb.from("products").update(payload).eq("id",id):sb.from("products").insert(payload);const {error}=await q;if(error){setStatus("Save failed: "+error.message);return}resetForm();await load()}
async function removeProduct(id){if(!confirm("Delete this product?"))return;setStatus("Deleting…");const {error}=await sb.from("products").delete().eq("id",id);if(error){setStatus("Delete failed: "+error.message);return}await load()}
$("productForm").addEventListener("submit",save);sb.auth.getSession().then(({data})=>{if(data.session)showApp()});
</script>
</body></html>
